<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:88px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;--primary:#2C1810;--primary-light:#5B3A29;--shadow:rgba(91,58,41,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:20px;line-height:1.8;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{-webkit-user-drag:none;}
/* ───── sidebar ───── */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:10px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s,background .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13.5px;font-weight:700;
  letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;padding-top:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:4px;
  text-decoration:none;color:var(--sbText);padding:4px 4px;width:100%;
  transition:all .25s;cursor:pointer;}
.sb-circle{width:36px;height:36px;border-radius:50%;
  border:1.5px solid rgba(212,196,168,.4);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif TC",serif;font-size:16px;font-weight:600;
  transition:all .25s;}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;
  letter-spacing:1px;opacity:.8;text-align:center;}
.sb-item:hover .sb-circle{border-color:var(--goldL);color:var(--goldL);}
.sb-item.active .sb-circle{background:var(--gold);border-color:var(--gold);
  color:#fff;box-shadow:0 0 14px rgba(184,134,11,.55);}
.sb-item.active .sb-label{opacity:1;color:var(--goldL);}
#sbToggle{display:none;position:fixed;left:14px;top:14px;z-index:200;
  width:42px;height:42px;border-radius:8px;border:1px solid var(--border);
  background:rgba(30,26,20,.92);color:var(--goldL);font-size:19px;cursor:pointer;}
/* ───── main ───── */
.main{margin-left:var(--sbW);}
/* hero */
.site-hero{position:relative;overflow:hidden;
  background:var(--headGrad);color:#f5ecd8;
  text-align:center;padding:96px 30px 84px;}
.site-hero::before{content:"\822C\82E5";position:absolute;
  left:50%;top:50%;transform:translate(-50%,-52%);
  font-size:380px;font-weight:900;opacity:.035;color:#fff;
  pointer-events:none;white-space:nowrap;letter-spacing:30px;}
.hero-kicker{font-family:"Noto Sans TC",sans-serif;font-size:14px;
  letter-spacing:5px;color:rgba(245,236,216,.75);margin-bottom:22px;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:10px;
  color:var(--goldL);margin-bottom:18px;
  text-shadow:0 2px 16px rgba(0,0,0,.45);}
.hero-subtitle{font-size:20px;letter-spacing:6px;color:#f0e4cc;margin-bottom:14px;}
.hero-range{font-family:"Noto Sans TC",sans-serif;font-size:17px;
  letter-spacing:2.5px;color:rgba(245,236,216,.85);
  border-top:1px solid rgba(212,168,75,.35);
  display:inline-block;padding-top:16px;margin-top:6px;}
/* preface */
.preface{max-width:880px;margin:54px auto 10px;padding:0 28px;}
.preface-inner{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:12px;padding:32px 38px;box-shadow:0 2px 12px var(--shadow);}
.preface-title{font-size:30px;color:var(--accent);letter-spacing:8px;
  text-align:center;margin-bottom:20px;font-weight:700;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);
  margin:0 0 14px;text-align:justify;}
.preface p:last-child{margin-bottom:0;}
/* toc */
.toc-section{max-width:1100px;margin:64px auto 30px;padding:0 28px;}
.toc-title{font-size:34px;text-align:center;color:var(--accent);
  letter-spacing:12px;font-weight:700;margin-bottom:12px;}
.toc-desc{font-family:"Noto Sans TC",sans-serif;font-size:17px;text-align:center;
  color:var(--text-muted);letter-spacing:3px;margin-bottom:36px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.toc-card{display:flex;align-items:flex-start;gap:16px;text-decoration:none;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:20px 22px;transition:all .25s;box-shadow:0 1px 4px var(--shadow);}
.toc-card:hover{transform:translateY(-3px);border-color:var(--gold);
  box-shadow:0 6px 18px rgba(91,58,41,.14);}
.toc-num{flex:none;width:42px;height:42px;border-radius:50%;
  background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;font-family:"Noto Serif TC",serif;}
.toc-name{font-size:19.5px;line-height:1.7;color:var(--text);font-weight:600;}
.toc-sub{display:block;font-family:"Noto Sans TC",sans-serif;font-size:14px;
  color:var(--text-muted);font-weight:400;margin-top:5px;letter-spacing:.5px;}
/* chapters */
.chapter{margin:70px 0 0;}
.ch-head{background:var(--headGrad);color:#f5ecd8;text-align:center;
  padding:58px 26px 50px;position:relative;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:24px;
  transform:translateX(-50%);width:120px;height:2px;
  background:linear-gradient(90deg,transparent,var(--goldL),transparent);}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;
  letter-spacing:4px;color:rgba(212,168,75,.9);margin-bottom:14px;}
.ch-name{font-size:34px;font-weight:900;letter-spacing:6px;color:#fdf6e3;margin-bottom:12px;}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:17px;
  letter-spacing:2px;color:rgba(245,236,216,.78);}
.ch-body{max-width:1080px;margin:0 auto;padding:44px 28px 30px;}
/* bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:20px 26px;margin:0 0 28px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:32px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;background:var(--gold);color:#fff;
  padding:3px 14px;border-radius:12px;letter-spacing:2.2px;margin-bottom:12px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}
/* iframe */
.ch-frame{display:block;width:100%;border:0;
  background:#fffdf7;border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}
.next-link{display:block;text-align:center;margin:20px auto 0;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;letter-spacing:2px;
  color:var(--accent);text-decoration:none;padding:12px 0;transition:color .25s;}
.next-link:hover{color:var(--gold);}
/* footer */
.site-footer{background:var(--headGrad);color:rgba(245,236,216,.8);
  text-align:center;padding:54px 26px;margin-top:80px;}
.site-footer p{font-size:15px;letter-spacing:3px;line-height:2.4;margin:0;}
.site-footer .ft-verse{color:var(--goldL);font-size:16px;letter-spacing:4px;}
/* read progress */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}
/* back top */
#backTop{position:fixed;right:22px;bottom:26px;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--border);
  background:rgba(30,26,20,.9);color:var(--goldL);font-size:19px;
  cursor:pointer;z-index:130;opacity:0;pointer-events:none;
  transition:opacity .3s;}
#backTop.show{opacity:1;pointer-events:auto;}
#backTop:hover{background:var(--gold);color:#fff;}
/* responsive */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .site-hero{padding:76px 20px 60px;}
  .hero-title{font-size:38px;letter-spacing:6px;}
  .ch-name{font-size:26px;letter-spacing:3px;}
  .ch-body{padding:34px 14px 24px;}
  .toc-grid{grid-template-columns:1fr;}
}
@media (max-width:600px){
  body{font-size:15.5px;}
  .hero-title{font-size:30px;}
  .preface-inner{padding:22px 20px;}
}

  width:100%;margin:18px 0 4px;padding:18px 4px 6px;position:relative;}
.sb-cross::before{content:"";position:absolute;top:0;left:14%;right:14%;

.sb-cross::after{content:"";position:absolute;top:6px;left:38%;right:38%;
  height:1px;background:linear-gradient(90deg,
    transparent,rgba(184,134,11,.55),transparent);}
.sb-x{display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;color:var(--sbText,#d4c4a8);padding:4px 4px;width:100%;
  border-radius:7px;transition:all .25s;}
.sb-x:hover{background:rgba(184,134,11,.14);transform:translateY(-1px);}
.sb-x-glyph{width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.2px solid rgba(212,196,168,.55);
  color:var(--goldL,#d4a84b);font-family:"Noto Sans TC",sans-serif;font-size:14px;
  background:rgba(184,134,11,.08);transition:all .25s;}
.sb-x:hover .sb-x-glyph{border-color:var(--gold,#b8860b);color:#fff;
  background:linear-gradient(135deg,var(--gold,#b8860b),var(--goldL,#d4a84b));
  box-shadow:0 0 10px rgba(184,134,11,.5);}
.sb-x-label{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;
  letter-spacing:1.2px;color:var(--sbText,#d4c4a8);opacity:.78;text-align:center;
  line-height:1.25;}
.sb-x:hover .sb-x-label{color:var(--goldL,#d4a84b);opacity:1;}
.sb-x-hub .sb-x-glyph{background:linear-gradient(135deg,

  border-color:rgba(212,168,75,.55);color:var(--goldL,#d4a84b);font-size:13px;
  font-weight:700;letter-spacing:1px;}

<script>
/* anti-copy outer */
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
})();
/* progress capsule */
var rpFill=document.getElementById('rpFill');
var rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();
/* capsule fade near footer */
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');
  if(f1)targets.push(f1);
  var f2=document.querySelector('.site-footer');
  if(f2)targets.push(f2);
  if(!targets.length)return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      var any=entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  }else{
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh-sb<240);
    };
    window.addEventListener('scroll',check,{passive:true});
    check();
  }
})();
/* iframe auto height */
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';
    d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';
      d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){
      f.style.height=h+'px';
      f.style.minHeight='0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries<30)setTimeout(tick,200);
  }
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(resizeAllFrames,200);
});
/* anchor click: recalc frames first */
document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el)return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);
/* polling 15s */
var _rt=0,_riv=setInterval(function(){
  _rt++;resizeAllFrames();
  if(_rt>50)clearInterval(_riv);
},300);
/* sidebar highlight */
function highlight(){
  var secs=document.querySelectorAll('section.chapter');
  var active=null;
  secs.forEach(function(s){
    if(s.getBoundingClientRect().top<window.innerHeight*0.35)active=s;
  });
  document.querySelectorAll('.sb-item').forEach(function(it){
    it.classList.toggle('active',!!active&&it.getAttribute('data-ch')===active.getAttribute('data-ch'));
  });
}
window.addEventListener('scroll',highlight,{passive:true});
highlight();
/* back top */
var bt=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  bt.classList.toggle('show',window.scrollY>600);
},{passive:true});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
/* brand */
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
/* hamburger */
var tg=document.getElementById('sbToggle');
if(tg){
  tg.addEventListener('click',function(){
    document.getElementById('sb').classList.toggle('open');
  });
  document.addEventListener('click',function(e){
    var sb=document.getElementById('sb');
    if(sb.classList.contains('open')&&!sb.contains(e.target)&&e.target!==tg){
      sb.classList.remove('open');
    }
  });
}
</script>

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-66-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
